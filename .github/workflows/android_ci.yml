name: OmniFace AI Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend_ci:
    name: 🌐 Backend & Multi-Tenant Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: omniface_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: 🏗️ Verify Next.js Build
        run: |
          cd backend
          npm run build
        env:
          DATABASE_URL: 'postgresql://test_user:test_password@localhost:5432/omniface_test'

      - name: 🧪 Run Backend Integration Tests
        run: |
          cd backend
          npm test
          npm run test:audit
          npm run backup:test
        env:
          OMNIFACE_SESSION_SECRET: 'omni_test_session_secret_7f8a9b0c1d2e3f4a5b6c7d8e9f'
          MIGRATION_SECRET: 'omni_migration_secret_secure_entropy_key_9981'
          DATABASE_URL: 'postgresql://test_user:test_password@localhost:5432/omniface_test'

  android_ci:
    name: 🧪 Run Android Biometric Unit Tests & Package Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🧪 Execute Biometric Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 📦 Assemble Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

