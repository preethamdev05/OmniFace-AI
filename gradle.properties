org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
android.uniquePackageNames=false
org.gradle.warning.mode=none
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
kotlin.incremental=false
ksp.incremental=false
ksp.use.daemon=false

# aapt2 'optimize' produces empty archives with the local ARM64 toolchain override;
# packaging consumes the unoptimized binary resources instead.
android.enableResourceOptimizations=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
